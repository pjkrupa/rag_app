[project]
name = "rag_app"
version = "0.1.0"
description = "an app for RAG-enhanced chats with LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.5",
    "dotenv>=0.9.9",
    "fastapi>=0.123.3",
    "jinja2>=3.1.6",
    "markdown>=3.10",
    "openai>=2.8.1",
    "pydantic>=2.12.4",
    "pytest>=9.0.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/rag_app/api/static/**",
  "src/rag_app/api/templates/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[project.scripts]
rag-app-serve = "rag_app.api.main:serve"
rag-app-cli = "rag_app.cli.main:main"

[tool.uv]
package = true